<!DOCTYPE html>
<html>

<head>
    <title>Q3 - Navbar with Dropdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: beige;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            background-color: darkcyan;
            overflow: hidden;
        }

        .navbar a {
            float: left;
            color: lightcyan;
            padding: 14px 20px;
            text-decoration: none;
        }

        .dropdown {
            float: left;
            position: initial;
        }

        .dropdown .dropbtn {
            background-color: inherit;
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: lightseagreen;
            min-width: 160px;
            z-index: 1;
        }

        .dropdown-content a {
            color: white;
            padding: 10px;
            text-decoration: none;
            display: block;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .navbar a:hover,
        .dropdown:hover .dropbtn,
        .dropdown-content a:hover {
            background-color: lightskyblue;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>

        <div class="dropdown">
            <button class="dropbtn">Services</button>
            <div class="dropdown-content">
                <a href="#">Web Design</a>
                <a href="#">Development</a>
                <a href="#">SEO</a>
            </div>
        </div>

        <a href="#">Contact</a>
    </div>

</body>

</html>
