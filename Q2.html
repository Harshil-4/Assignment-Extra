<!DOCTYPE html>
<html>
<head>
  <title>Q2 - Tourism Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <h1>Tourism Image Gallery (Nepal, Bhutan, etc.)</h1>

  <div class="gallery">
    <img src="p1.png" alt="Nepal Mountains">
    <img src="p2.png" alt="Bhutan Temple">
    <img src="p3.png" alt="Himalayas">
    <img src="p4.png" alt="Kathmandu">
    <img src="p5.png" alt="Monastery">
    <img src="p6.png" alt="Trekking in Nepal">
    <img src="p7.png" alt="Bhutan Landscape">
    <img src="p8.png" alt="Nepal Culture">
    <img src="p9.png" alt="Bhutan Nature">
    <img src="p10.png" alt="Mountain Travel">
  </div>

</body>
</html>
